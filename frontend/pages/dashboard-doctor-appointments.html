<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appointment Requests — DermisAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app-layout">
  <div id="navMount"></div>

  <main class="main-content" id="mainContent">
    <div class="page-header">
      <div class="page-header-text">
        <h1 class="page-title">Appointment Requests</h1>
        <p class="page-subtitle">Review and respond to patient requests</p>
      </div>
    </div>

    <div class="page-body">

      <!-- Filter tabs -->
      <div style="display:flex;gap:var(--space-2);margin-bottom:var(--space-5)">
        <button class="btn btn-primary btn-sm" id="filterPending">
          Pending (<span id="pendingTabCount">0</span>)
        </button>
        <button class="btn btn-secondary btn-sm" id="filterAll">
          All
        </button>
      </div>

      <!-- Appointments table -->
      <div class="card">
        <div class="table-container" style="border-radius:0;border:none;box-shadow:none">
          <table>
            <thead>
              <tr>
                <th>Requested</th>
                <th>Patient</th>
                <th>Scan Date</th>
                <th>Result</th>
                <th>Patient Notes</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="apptTbody">
              <tr>
                <td colspan="6" style="text-align:center;padding:var(--space-8);color:var(--color-text-muted)">
                  Loading...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>

<script>
  var API_BASE = "/api";
  sessionStorage.removeItem("dermis_user");

  // ── Auth guard ─────────────────────────────────────────────────────────────
  var token   = localStorage.getItem("dermis_token");
  var rawUser = localStorage.getItem("dermis_user");
  if (!token || !rawUser) { window.location.href = "index.html"; }
  var currentUser = JSON.parse(rawUser);
  if (currentUser.role !== "dermatologist") { window.location.href = "index.html"; }

  function authHeaders() {
    return { "Content-Type": "application/json", "Authorization": "Bearer " + token };
  }

  // ── SVG icons ──────────────────────────────────────────────────────────────
  var LOGO_SVG   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 0 1 10 10"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg>';
  var LOGOUT_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>';
  var DASH_SVG   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>';
  var UPLOAD_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>';
  var APPT_SVG   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
  var MENU_SVG   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>';

  var ROLE_LABELS = { admin: "Administrator", dermatologist: "Dermatologist", patient: "Patient" };

  function initials(name) {
    return name.split(" ").filter(function(w){ return w; }).map(function(w){ return w[0]; }).join("").slice(0,2).toUpperCase();
  }

  // ── Build sidebar (Appointments is active) ─────────────────────────────────
  function buildNav() {
    var navItems =
      '<a href="dashboard-doctor.html" class="nav-item">' + DASH_SVG + '<span>Dashboard</span></a>' +
      '<a href="upload.html" class="nav-item">' + UPLOAD_SVG + '<span>Upload &amp; Predict</span></a>' +
      '<a href="dashboard-doctor-appointments.html" class="nav-item active" aria-current="page">' + APPT_SVG + '<span>Appointments</span></a>';

    var sidebar =
      '<aside class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">' +
        '<div class="sidebar-header"><div class="sidebar-logo">' + LOGO_SVG + '</div>' +
        '<div class="sidebar-brand"><span class="sidebar-brand-name">DermisAI</span><span class="sidebar-brand-sub">Clinical Detection</span></div></div>' +
        '<nav class="sidebar-nav"><div class="nav-section"><span class="nav-section-label">Navigation</span></div>' + navItems + '</nav>' +
        '<div class="sidebar-footer"><div class="sidebar-user">' +
          '<div class="user-avatar">' + initials(currentUser.full_name || currentUser.email) + '</div>' +
          '<div class="user-info"><div class="user-name">' + (currentUser.full_name || currentUser.email) + '</div>' +
          '<div class="user-role">' + (ROLE_LABELS[currentUser.role] || currentUser.role) + '</div></div></div>' +
          '<a href="#" id="logoutLink" class="btn-logout">' + LOGOUT_SVG + '<span>Sign out</span></a>' +
        '</div></aside>' +
        '<div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>';

    var mobileHeader =
      '<header class="mobile-header" role="banner">' +
        '<div class="mobile-header-brand">' + LOGO_SVG + '<span>Appointments</span></div>' +
        '<button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open navigation menu" aria-expanded="false">' + MENU_SVG + '</button>' +
      '</header>';

    var mount = document.getElementById("navMount");
    if (mount) { mount.innerHTML = sidebar + mobileHeader; }

    var mhEl = document.querySelector(".mobile-header"), al = document.querySelector(".app-layout");
    if (mhEl && al && al.contains(mhEl)) { al.parentNode.insertBefore(mhEl, al); }

    var btn = document.getElementById("mobileMenuBtn"), sb = document.getElementById("sidebar"), ov = document.getElementById("sidebarOverlay");
    if (btn && sb && ov) {
      btn.addEventListener("click", function(){ sb.classList.add("open"); ov.classList.add("active"); btn.setAttribute("aria-expanded","true"); document.body.style.overflow="hidden"; });
      ov.addEventListener("click",  function(){ sb.classList.remove("open"); ov.classList.remove("active"); btn.setAttribute("aria-expanded","false"); document.body.style.overflow=""; });
    }

    document.getElementById("logoutLink").addEventListener("click", function(e) {
      e.preventDefault();
      localStorage.removeItem("dermis_token");
      localStorage.removeItem("dermis_user");
      sessionStorage.removeItem("dermis_user");
      window.location.href = "index.html";
    });
  }

  buildNav();

  // ── State ──────────────────────────────────────────────────────────────────
  var allAppointments = [];  // full list from API
  var activeFilter    = "pending";  // "pending" | "all"

  // ── Date formatter ─────────────────────────────────────────────────────────
  function fmtDate(iso) {
    if (!iso) return "—";
    return new Date(iso).toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
  }

  // ── Badge helpers ──────────────────────────────────────────────────────────
  function resultBadge(result) {
    if (result === "cancer_detected") {
      return '<span class="badge badge-concern"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:11px;height:11px"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>Cancer detected</span>';
    }
    if (!result) return '<span class="badge badge-neutral">—</span>';
    return '<span class="badge badge-healthy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:11px;height:11px"><polyline points="20 6 9 17 4 12"/></svg>Healthy</span>';
  }

  // ── Filter tab state ───────────────────────────────────────────────────────
  function setFilter(filter) {
    activeFilter = filter;
    var btnPending = document.getElementById("filterPending");
    var btnAll     = document.getElementById("filterAll");
    if (filter === "pending") {
      btnPending.className = "btn btn-primary btn-sm";
      btnAll.className     = "btn btn-secondary btn-sm";
    } else {
      btnPending.className = "btn btn-secondary btn-sm";
      btnAll.className     = "btn btn-primary btn-sm";
    }
    renderTable();
  }

  // ── Render table from cached data + active filter ──────────────────────────
  function renderTable() {
    var tbody = document.getElementById("apptTbody");
    var pending = allAppointments.filter(function(a){ return a.status === "pending"; });

    // Update pending tab count
    document.getElementById("pendingTabCount").textContent = pending.length;

    var list = activeFilter === "pending" ? pending : allAppointments;

    if (!list.length) {
      var emptyMsg = activeFilter === "pending"
        ? "No pending appointment requests."
        : "No appointment requests yet.";
      tbody.innerHTML =
        '<tr><td colspan="6">' +
          '<div class="state-container">' +
            '<div class="state-icon empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>' +
            '<p class="state-title">' + emptyMsg + '</p>' +
          '</div>' +
        '</td></tr>';
      return;
    }

    tbody.innerHTML = list.map(function(a) {
      // Patient cell
      var patientCell =
        '<div style="font-weight:var(--weight-medium)">' + (a.patient_full_name || "—") + '</div>' +
        '<div style="font-size:var(--text-xs);color:var(--color-text-muted)">' + (a.patient_email || "") + '</div>';

      // Scan summary
      var scanDate   = "—";
      var scanResult = null;
      var scanConf   = "";
      if (a.prediction_summary) {
        scanDate   = fmtDate(a.prediction_summary.detection_timestamp);
        scanResult = a.prediction_summary.prediction;
        if (a.prediction_summary.confidence != null) {
          scanConf = '<div style="font-size:var(--text-xs);color:var(--color-text-muted);margin-top:2px">' +
            Math.round(a.prediction_summary.confidence * 100) + '% confidence</div>';
        }
      }

      // Patient notes
      var notesCell = a.patient_notes
        ? '<span style="font-size:var(--text-xs)">' + a.patient_notes + '</span>'
        : '<span style="color:var(--color-text-muted)">—</span>';

      // Actions cell depends on status
      var actionsCell;
      if (a.status === "pending") {
        actionsCell =
          '<div style="display:flex;gap:var(--space-2);flex-wrap:wrap">' +
            '<button class="btn btn-success btn-sm appt-action" data-id="' + a.appointment_id + '" data-action="approve">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:13px;height:13px"><polyline points="20 6 9 17 4 12"/></svg>' +
              'Approve' +
            '</button>' +
            '<button class="btn btn-danger btn-sm appt-action" data-id="' + a.appointment_id + '" data-action="deny">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
              'Deny' +
            '</button>' +
          '</div>';
      } else if (a.status === "approved") {
        actionsCell =
          '<span class="badge badge-healthy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:11px;height:11px"><polyline points="20 6 9 17 4 12"/></svg>Approved</span>';
        if (a.doctor_full_name) {
          actionsCell += '<div style="font-size:var(--text-xs);color:var(--color-text-muted);margin-top:2px">' + a.doctor_full_name + '</div>';
        }
        if (a.doctor_notes) {
          actionsCell += '<div style="font-size:var(--text-xs);color:var(--color-text-secondary);margin-top:2px">' + a.doctor_notes + '</div>';
        }
      } else if (a.status === "denied") {
        actionsCell =
          '<span class="badge badge-concern"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:11px;height:11px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Denied</span>';
      } else {
        actionsCell = '<span class="badge badge-neutral">' + a.status + '</span>';
      }

      return '<tr>' +
        '<td style="white-space:nowrap;font-size:var(--text-sm);color:var(--color-text-muted)">' + fmtDate(a.requested_at) + '</td>' +
        '<td>' + patientCell + '</td>' +
        '<td style="white-space:nowrap;font-size:var(--text-sm);color:var(--color-text-muted)">' + scanDate + '</td>' +
        '<td>' + resultBadge(scanResult) + scanConf + '</td>' +
        '<td>' + notesCell + '</td>' +
        '<td>' + actionsCell + '</td>' +
      '</tr>';
    }).join("");

    // Wire action buttons
    document.querySelectorAll(".appt-action").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var apptId = btn.getAttribute("data-id");
        var action = btn.getAttribute("data-action");

        // Disable both buttons in this row
        var row = btn.closest("tr");
        if (row) {
          row.querySelectorAll(".appt-action").forEach(function(b){ b.disabled = true; });
        }
        btn.textContent = action === "approve" ? "Approving…" : "Denying…";

        fetch(API_BASE + "/appointments/" + apptId, {
          method: "PATCH",
          headers: authHeaders(),
          body: JSON.stringify({ action: action })
        })
        .then(function(r) { return r.json().then(function(d){ return { status: r.status, data: d }; }); })
        .then(function(result) {
          if (result.status === 401) {
            localStorage.removeItem("dermis_token");
            localStorage.removeItem("dermis_user");
            sessionStorage.removeItem("dermis_user");
            window.location.href = "index.html"; return;
          }
          if (result.data && result.data.success) {
            // Update the local record so re-render is instant
            var updated = result.data.appointment;
            for (var i = 0; i < allAppointments.length; i++) {
              if (allAppointments[i].appointment_id === updated.appointment_id) {
                allAppointments[i] = updated; break;
              }
            }
            renderTable();
          } else {
            // Re-enable buttons and show inline error
            if (row) {
              row.querySelectorAll(".appt-action").forEach(function(b){ b.disabled = false; });
            }
            showInlineError(apptId, (result.data && result.data.message) || "Request failed.");
          }
        })
        .catch(function() {
          if (row) {
            row.querySelectorAll(".appt-action").forEach(function(b){ b.disabled = false; });
          }
          showInlineError(apptId, "Cannot reach the server.");
        });
      });
    });
  }

  // ── Inline error under a specific row's actions cell ──────────────────────
  function showInlineError(apptId, msg) {
    var btn = document.querySelector('.appt-action[data-id="' + apptId + '"]');
    if (!btn) return;
    var actionsCell = btn.parentNode.parentNode; // td
    var err = document.createElement("div");
    err.style.cssText = "color:var(--color-concern);font-size:var(--text-xs);margin-top:var(--space-1)";
    err.textContent = msg;
    actionsCell.appendChild(err);
  }

  // ── Load all appointments from API ─────────────────────────────────────────
  function loadData() {
    document.getElementById("apptTbody").innerHTML =
      '<tr><td colspan="6" style="text-align:center;padding:var(--space-8)">' +
        '<div class="spinner" style="margin:0 auto"></div>' +
      '</td></tr>';

    fetch(API_BASE + "/appointments", { headers: authHeaders() })
    .then(function(r) { return r.json().then(function(d){ return { status: r.status, data: d }; }); })
    .then(function(result) {
      if (result.status === 401) {
        localStorage.removeItem("dermis_token");
        localStorage.removeItem("dermis_user");
        sessionStorage.removeItem("dermis_user");
        window.location.href = "index.html"; return;
      }
      if (result.data && result.data.success) {
        allAppointments = result.data.appointments || [];
        renderTable();
      } else {
        document.getElementById("apptTbody").innerHTML =
          '<tr><td colspan="6"><div class="state-container">' +
            '<div class="state-icon error"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>' +
            '<p class="state-title">Failed to load appointments</p>' +
            '<p class="state-description">' + ((result.data && result.data.message) || "Unknown error") + '</p>' +
            '<button class="btn btn-secondary btn-sm" id="retryBtn" style="margin-top:var(--space-4)">Retry</button>' +
          '</div></td></tr>';
        document.getElementById("retryBtn").addEventListener("click", loadData);
      }
    })
    .catch(function() {
      document.getElementById("apptTbody").innerHTML =
        '<tr><td colspan="6"><div class="state-container">' +
          '<div class="state-icon error"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>' +
          '<p class="state-title">Cannot reach the server</p>' +
          '<p class="state-description">Is the backend running?</p>' +
          '<button class="btn btn-secondary btn-sm" id="retryBtn" style="margin-top:var(--space-4)">Retry</button>' +
        '</div></td></tr>';
      document.getElementById("retryBtn").addEventListener("click", loadData);
    });
  }

  // ── Filter button wiring ───────────────────────────────────────────────────
  document.getElementById("filterPending").addEventListener("click", function(){ setFilter("pending"); });
  document.getElementById("filterAll").addEventListener("click",     function(){ setFilter("all"); });

  // ── Boot ───────────────────────────────────────────────────────────────────
  loadData();
</script>
</body>
</html>
