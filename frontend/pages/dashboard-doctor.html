<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor Dashboard — DermisAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app-layout">
  <div id="navMount"></div>

  <main class="main-content" id="mainContent">
    <div class="page-header">
      <div class="page-header-text">
        <h1 class="page-title">Doctor Dashboard</h1>
        <p class="page-subtitle">Your predictions and pending reviews</p>
      </div>
      <a href="upload.html" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        New Prediction
      </a>
    </div>

    <div class="page-body">

      <!-- Stat cards -->
      <div class="grid-4" style="margin-bottom:var(--space-6)">
        <div class="stat-card">
          <div class="stat-card-header">
            <div>
              <div class="stat-card-value">—</div>
              <div class="stat-card-label">Predictions Today</div>
            </div>
            <div class="stat-card-icon icon-blue">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header">
            <div>
              <div class="stat-card-value">—</div>
              <div class="stat-card-label">Pending Reviews</div>
            </div>
            <div class="stat-card-icon icon-amber">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header">
            <div>
              <div class="stat-card-value">—</div>
              <div class="stat-card-label">Referrals</div>
            </div>
            <div class="stat-card-icon icon-red">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header">
            <div>
              <div class="stat-card-value">—</div>
              <div class="stat-card-label">Total This Month</div>
            </div>
            <div class="stat-card-icon icon-green">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Recent predictions table -->
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Recent Predictions</h2>
          <a href="upload.html" class="btn btn-secondary btn-sm">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New
          </a>
        </div>
        <div class="table-container" style="border-radius:0;border:none;box-shadow:none">
          <table>
            <thead>
              <tr><th>Date</th><th>Patient</th><th>Result</th><th>Status</th></tr>
            </thead>
            <tbody id="predsTbody">
              <tr>
                <td colspan="4" style="text-align:center;padding:var(--space-8);color:var(--color-text-muted)">
                  No predictions yet — upload an image to start
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Pending appointments banner (shown only when count > 0) -->
      <div class="alert alert-info" id="pendingBanner" style="display:none;margin-bottom:var(--space-6)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;flex-shrink:0"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        You have <strong><span id="pendingCount">0</span></strong> pending appointment request(s).
        <a href="dashboard-doctor-appointments.html" style="margin-left:auto;white-space:nowrap">View all &rarr;</a>
      </div>

    </div>
  </main>
</div>

<script>
  var API_BASE = "/api";

  // ── Clear legacy sessionStorage ───────────────────────────────────────────
  sessionStorage.removeItem("dermis_user");

  // ── Auth guard ─────────────────────────────────────────────────────────────
  var token   = localStorage.getItem("dermis_token");
  var rawUser = localStorage.getItem("dermis_user");
  if (!token || !rawUser) { window.location.href = "index.html"; }
  var currentUser = JSON.parse(rawUser);
  if (currentUser.role !== "dermatologist") { window.location.href = "index.html"; }

  // ── Helpers ────────────────────────────────────────────────────────────────
  var ROLE_LABELS = { admin: "Administrator", dermatologist: "Dermatologist", patient: "Patient" };

  function initials(name) {
    return name.split(" ").filter(function(w){return w;}).map(function(w){return w[0];}).join("").slice(0,2).toUpperCase();
  }

  function fmtDate(iso) {
    if (!iso) return "—";
    return new Date(iso).toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
  }

  function authHeaders() {
    return { "Content-Type": "application/json", "Authorization": "Bearer " + token };
  }

  // ── Build sidebar ──────────────────────────────────────────────────────────
  var LOGO_SVG   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 0 1 10 10"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg>';
  var LOGOUT_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>';
  var DASH_SVG   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>';
  var UPLOAD_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>';
  var APPT_SVG   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
  var MENU_SVG   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>';

  function buildNav() {
    var navItems =
      '<a href="dashboard-doctor.html" class="nav-item active" aria-current="page">' + DASH_SVG + '<span>Dashboard</span></a>' +
      '<a href="upload.html" class="nav-item">' + UPLOAD_SVG + '<span>Upload &amp; Predict</span></a>' +
      '<a href="dashboard-doctor-appointments.html" class="nav-item">' + APPT_SVG + '<span>Appointments</span></a>';
    var sidebar =
      '<aside class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">' +
        '<div class="sidebar-header"><div class="sidebar-logo">' + LOGO_SVG + '</div>' +
        '<div class="sidebar-brand"><span class="sidebar-brand-name">DermisAI</span><span class="sidebar-brand-sub">Clinical Detection</span></div></div>' +
        '<nav class="sidebar-nav"><div class="nav-section"><span class="nav-section-label">Navigation</span></div>' + navItems + '</nav>' +
        '<div class="sidebar-footer"><div class="sidebar-user">' +
          '<div class="user-avatar">' + initials(currentUser.full_name || currentUser.email) + '</div>' +
          '<div class="user-info"><div class="user-name">' + (currentUser.full_name || currentUser.email) + '</div>' +
          '<div class="user-role">' + (ROLE_LABELS[currentUser.role] || currentUser.role) + '</div></div></div>' +
          '<a href="#" id="logoutLink" class="btn-logout">' + LOGOUT_SVG + '<span>Sign out</span></a>' +
        '</div></aside>' +
        '<div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>';
    var mobileHeader =
      '<header class="mobile-header" role="banner">' +
        '<div class="mobile-header-brand">' + LOGO_SVG + '<span>Doctor Dashboard</span></div>' +
        '<button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open navigation menu" aria-expanded="false">' + MENU_SVG + '</button>' +
      '</header>';
    var mount = document.getElementById("navMount");
    if (mount) { mount.innerHTML = sidebar + mobileHeader; }
    var mhEl = document.querySelector(".mobile-header"), al = document.querySelector(".app-layout");
    if (mhEl && al && al.contains(mhEl)) { al.parentNode.insertBefore(mhEl, al); }
    var btn = document.getElementById("mobileMenuBtn"), sb = document.getElementById("sidebar"), ov = document.getElementById("sidebarOverlay");
    if (btn && sb && ov) {
      btn.addEventListener("click", function(){ sb.classList.add("open"); ov.classList.add("active"); btn.setAttribute("aria-expanded","true"); document.body.style.overflow="hidden"; });
      ov.addEventListener("click",  function(){ sb.classList.remove("open"); ov.classList.remove("active"); btn.setAttribute("aria-expanded","false"); document.body.style.overflow=""; });
    }
    document.getElementById("logoutLink").addEventListener("click", function(e){
      e.preventDefault(); localStorage.removeItem("dermis_token"); localStorage.removeItem("dermis_user"); sessionStorage.removeItem("dermis_user"); window.location.href = "index.html";
    });
  }

  buildNav();

  // ── Stat cards — by position in .grid-4 ────────────────────────────────────
  // 0=Predictions Today, 1=Pending Reviews, 2=Referrals, 3=Total This Month
  var statCards = document.querySelectorAll(".stat-card-value");

  // ── Predictions table elements ─────────────────────────────────────────────
  var predsThead = document.querySelector("thead tr");
  var predsTbody = document.getElementById("predsTbody");

  // Update predictions thead columns
  predsThead.innerHTML = "<th>Date</th><th>Patient</th><th>Result</th><th>Confidence</th><th>Status</th>";

  // ── Badge helpers ──────────────────────────────────────────────────────────
  function resultBadge(result) {
    if (result === "cancer_detected") {
      return '<span class="badge badge-concern"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:11px;height:11px"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>Cancer detected</span>';
    }
    if (!result) return '<span class="badge badge-neutral">—</span>';
    return '<span class="badge badge-healthy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:11px;height:11px"><polyline points="20 6 9 17 4 12"/></svg>Healthy</span>';
  }

  // ── Render predictions ─────────────────────────────────────────────────────
  function renderPredictions(preds) {
    if (!preds || !preds.length) {
      predsTbody.innerHTML =
        '<tr><td colspan="5"><div class="state-container">' +
        '<p class="state-title">No predictions yet</p>' +
        '<p class="state-description"><a href="upload.html">Upload an image</a> to create your first prediction.</p>' +
        '</div></td></tr>';
      return;
    }
    predsTbody.innerHTML = preds.map(function(p) {
      var conf = p.confidence != null ? Math.round(p.confidence * 100) + "%" : "—";
      var status = p.clinician_agreement == null
        ? '<span class="badge badge-warning">Pending review</span>'
        : '<span class="badge badge-neutral">Reviewed</span>';
      var patLabel = p.patient_age_group
        ? (p.patient_age_group + (p.patient_skin_type ? " / " + p.patient_skin_type : ""))
        : (p.patient_id ? p.patient_id.slice(0, 8) + "…" : "—");
      return '<tr>' +
        '<td style="white-space:nowrap;color:var(--color-text-muted);font-size:var(--text-sm)">' + fmtDate(p.detection_timestamp) + '</td>' +
        '<td style="color:var(--color-text-secondary);font-size:var(--text-sm)">' + patLabel + '</td>' +
        '<td>' + resultBadge(p.prediction) + '</td>' +
        '<td style="font-size:var(--text-sm)">' + conf + '</td>' +
        '<td>' + status + '</td>' +
      '</tr>';
    }).join("");
  }

  // ── Render appointments banner ─────────────────────────────────────────────
  // Only shows the pending count; full management is on the appointments page.
  function renderPendingBanner(appts) {
    var pending = appts.filter(function(a){ return a.status === "pending"; }).length;
    var banner  = document.getElementById("pendingBanner");
    var counter = document.getElementById("pendingCount");
    if (banner && counter) {
      counter.textContent = pending;
      banner.style.display = pending > 0 ? "flex" : "none";
    }
  }

  // ── Skeleton rows while predictions load ───────────────────────────────────
  function showSkeleton() {
    var row = '<tr><td><div class="skeleton skeleton-text" style="width:100px"></div></td><td><div class="skeleton skeleton-text" style="width:80px"></div></td><td><div class="skeleton skeleton-text" style="width:110px"></div></td><td><div class="skeleton skeleton-text" style="width:50px"></div></td><td><div class="skeleton skeleton-text" style="width:90px"></div></td></tr>';
    predsTbody.innerHTML = row + row + row;
  }

  function showPredsError(msg) {
    predsTbody.innerHTML =
      '<tr><td colspan="5"><div class="state-container">' +
        '<div class="state-icon error"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>' +
        '<p class="state-title">Failed to load predictions</p>' +
        '<p class="state-description">' + msg + '</p>' +
        '<button class="btn btn-secondary btn-sm" id="retryBtn" style="margin-top:var(--space-4)">Retry</button>' +
      '</div></td></tr>';
    var rb = document.getElementById("retryBtn");
    if (rb) { rb.addEventListener("click", loadData); }
  }

  // ── Load all data (stats + predictions + appointments) ─────────────────────
  function loadData() {
    showSkeleton();

    Promise.all([
      fetch(API_BASE + "/stats/doctor",         { headers: authHeaders() }).then(function(r){ return r.json().then(function(d){ return {status:r.status,data:d}; }); }),
      fetch(API_BASE + "/predictions?limit=20", { headers: authHeaders() }).then(function(r){ return r.json().then(function(d){ return {status:r.status,data:d}; }); }),
      fetch(API_BASE + "/appointments",         { headers: authHeaders() }).then(function(r){ return r.json().then(function(d){ return {status:r.status,data:d}; }); })
    ])
    .then(function(results) {
      var statsRes = results[0], predsRes = results[1], apptsRes = results[2];

      // 401 on any request → force re-login
      if (statsRes.status === 401 || predsRes.status === 401 || apptsRes.status === 401) {
        localStorage.removeItem("dermis_token"); localStorage.removeItem("dermis_user");
        window.location.href = "index.html"; return;
      }

      // ── Stat cards ────────────────────────────────────────────────────────
      if (statsRes.data && statsRes.data.success) {
        var s = statsRes.data.stats;
        statCards[0].textContent = s.predictions_today !== undefined ? s.predictions_today : "—";
        statCards[1].textContent = s.pending_reviews   !== undefined ? s.pending_reviews   : "—";
        statCards[2].textContent = s.referrals_flagged !== undefined ? s.referrals_flagged : "—";
        statCards[3].textContent = s.total_predictions !== undefined ? s.total_predictions : "—";
      }

      // ── Predictions table ─────────────────────────────────────────────────
      if (predsRes.data && predsRes.data.success) {
        renderPredictions(predsRes.data.predictions);
      } else {
        showPredsError((predsRes.data && predsRes.data.message) || "Unknown error");
      }

      // ── Appointments banner ───────────────────────────────────────────────
      if (apptsRes.data && apptsRes.data.success) {
        renderPendingBanner(apptsRes.data.appointments || []);
      }
      // (banner stays hidden on error — non-critical)
    })
    .catch(function() {
      showPredsError("Cannot reach the server. Is the backend running?");
    });
  }

  loadData();
</script>
</body>
</html>
