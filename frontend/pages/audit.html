<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audit Log — DermisAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .audit-header-stripe { background:linear-gradient(90deg,var(--color-navy) 0%,var(--color-navy-light) 100%);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:var(--space-4) var(--space-6);display:flex;align-items:center;gap:var(--space-4); }
    .audit-immutable-icon { width:36px;height:36px;border-radius:var(--radius-md);background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;flex-shrink:0; }
    .audit-immutable-icon svg { width:18px;height:18px;color:rgba(255,255,255,0.7); }
    .audit-stripe-text { flex:1; }
    .audit-stripe-title { font-size:var(--text-sm);font-weight:var(--weight-semibold);color:#fff; }
    .audit-stripe-sub { font-size:var(--text-xs);color:rgba(255,255,255,0.45); }
    .audit-stripe-seal { display:flex;align-items:center;gap:var(--space-2);background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.10);padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);font-size:10px;font-family:var(--font-mono);color:rgba(255,255,255,0.50); }
    .audit-stripe-seal svg { width:12px;height:12px;color:rgba(255,255,255,0.4); }
    .audit-wrapper { background:var(--color-surface);border:1px solid var(--color-border-light);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden; }
    .action-chip { display:inline-flex;align-items:center;gap:var(--space-1);padding:2px 8px;font-size:10px;font-family:var(--font-mono);font-weight:var(--weight-medium);border-radius:var(--radius-sm);white-space:nowrap;letter-spacing:0.02em; }
    .action-CREATE   { background:var(--color-healthy-light); color:var(--color-healthy); border:1px solid var(--color-healthy-border); }
    .action-VIEW     { background:var(--color-info-light);    color:var(--color-info);    border:1px solid var(--color-info-border); }
    .action-UPDATE   { background:var(--color-warning-light); color:var(--color-warning); border:1px solid var(--color-warning-border); }
    .action-VERIFY   { background:var(--color-info-light);    color:var(--color-info);    border:1px solid var(--color-info-border); }
    .action-LOGIN    { background:rgba(42,74,127,0.08);       color:var(--color-slate);   border:1px solid rgba(42,74,127,0.2); }
    .action-DEACTIVATE { background:var(--color-concern-light);color:var(--color-concern);border:1px solid var(--color-concern-border); }
    .action-SCHEDULED  { background:var(--color-bg-alt);color:var(--color-text-muted);border:1px solid var(--color-border); }
    .action-INTEGRITY  { background:var(--color-bg-alt);color:var(--color-text-muted);border:1px solid var(--color-border); }
    .table-tag { font-family:var(--font-mono);font-size:10px;background:var(--color-bg-alt);border:1px solid var(--color-border);padding:2px 6px;border-radius:var(--radius-sm);color:var(--color-text-muted); }
    .print-note { font-size:var(--text-xs);color:var(--color-text-muted);display:flex;align-items:center;gap:var(--space-2); }
    .print-note svg { width:13px;height:13px; }
  </style>
</head>
<body>
<div class="app-layout">
  <div id="navMount"></div>
  <main class="main-content" id="mainContent">
    <div class="page-header">
      <div class="page-header-text">
        <h1 class="page-title">Audit Log</h1>
        <p class="page-subtitle">Immutable record of all system actions — read-only</p>
      </div>
      <div class="print-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Ctrl+P to print
      </div>
    </div>
    <div class="page-body">
      <div class="audit-wrapper">
        <div class="audit-header-stripe">
          <div class="audit-immutable-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <div class="audit-stripe-text">
            <div class="audit-stripe-title">Append-only audit log</div>
            <div class="audit-stripe-sub">Records cannot be modified or deleted. Every system action is captured automatically.</div>
          </div>
          <div class="audit-stripe-seal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            IMMUTABLE &bull; SHA-256 SIGNED
          </div>
        </div>
        <div style="padding:var(--space-5) var(--space-6);border-bottom:1px solid var(--color-border-light);">
          <div class="table-toolbar" style="margin-bottom:0">
            <div class="table-search">
              <div class="input-with-icon">
                <span class="input-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
                <input type="search" class="form-control" id="auditSearch" placeholder="Search by user, action, log ID..." aria-label="Search audit log" />
              </div>
            </div>
            <div class="table-filters">
              <select class="filter-select" id="actionFilter" aria-label="Filter by action">
                <option value="">All actions</option>
                <option value="CREATE_PREDICTION">CREATE_PREDICTION</option>
                <option value="VERIFY_PREDICTION">VERIFY_PREDICTION</option>
                <option value="CREATE_PATIENT">CREATE_PATIENT</option>
                <option value="VIEW_PATIENT">VIEW_PATIENT</option>
                <option value="CREATE_USER">CREATE_USER</option>
                <option value="UPDATE_HOSPITAL">UPDATE_HOSPITAL</option>
                <option value="DEACTIVATE_USER">DEACTIVATE_USER</option>
                <option value="VIEW_AUDIT_LOG">VIEW_AUDIT_LOG</option>
                <option value="LOGIN">LOGIN</option>
                <option value="SCHEDULED_BACKUP">SCHEDULED_BACKUP</option>
                <option value="INTEGRITY_CHECK">INTEGRITY_CHECK</option>
              </select>
              <select class="filter-select" id="statusFilter" aria-label="Filter by status">
                <option value="">All statuses</option>
                <option value="success">Success</option>
                <option value="failed">Failed</option>
              </select>
            </div>
            <div style="margin-left:auto"><span id="logCount" class="text-sm text-muted"></span></div>
          </div>
        </div>
        <table>
          <thead>
            <tr><th>Log ID</th><th>User</th><th>Action</th><th>Table</th><th>Timestamp</th><th>IP address</th><th>Status</th></tr>
          </thead>
          <tbody id="auditTbody">
            <tr class="skeleton-row"><td colspan="7"><div class="skeleton skeleton-text" style="width:100%"></div></td></tr>
            <tr class="skeleton-row"><td colspan="7"><div class="skeleton skeleton-text" style="width:90%"></div></td></tr>
            <tr class="skeleton-row"><td colspan="7"><div class="skeleton skeleton-text" style="width:95%"></div></td></tr>
          </tbody>
        </table>
        <div id="auditPagMount"></div>
      </div>
    </div>
  </main>
</div>

<script>
/* ── Shared nav ── */
var DEMO_CURRENT_USER=(function(){try{return JSON.parse(sessionStorage.getItem("dermis_user"))||{name:"Dr. Sarah Okonkwo",role:"dermatologist"};}catch(e){return{name:"Dr. Sarah Okonkwo",role:"dermatologist"};}})();
var NAV_LINKS=[{href:"dashboard.html",label:"Dashboard",icon:"dashboard"},{href:"upload.html",label:"Upload & Predict",icon:"upload"},{href:"patients.html",label:"Patients",icon:"patients"},{href:"admin.html",label:"Administration",icon:"admin"},{href:"audit.html",label:"Audit Log",icon:"audit"}];
var NAV_ICONS={logo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 0 1 10 10"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg>',dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',patients:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',admin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>',audit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>',logout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>'};
var ROLE_LABELS={admin:"Administrator",dermatologist:"Dermatologist",general_practitioner:"General Practitioner",nurse:"Nurse"};
function initials(name){return name.split(" ").filter(Boolean).map(function(w){return w[0];}).join("").slice(0,2).toUpperCase();}
function currentPage(){return window.location.pathname.split("/").pop()||"index.html";}
function formatDateTime(iso){if(!iso)return"—";return new Date(iso).toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function debounce(fn,delay){var t;return function(){clearTimeout(t);t=setTimeout(fn,delay||300);};}
function initNav(){
  var user=DEMO_CURRENT_USER,page=currentPage();
  var ni=NAV_LINKS.map(function(l){var a=page===l.href?"active":"";return'<a href="'+l.href+'" class="nav-item '+a+'" aria-current="'+(a?"page":"false")+'">'+NAV_ICONS[l.icon]+'<span>'+l.label+'</span></a>';}).join("");
  var sb='<aside class="sidebar" id="sidebar" role="navigation"><div class="sidebar-header"><div class="sidebar-logo">'+NAV_ICONS.logo+'</div><div class="sidebar-brand"><span class="sidebar-brand-name">DermisAI</span><span class="sidebar-brand-sub">Clinical Detection</span></div></div><nav class="sidebar-nav"><div class="nav-section"><span class="nav-section-label">Navigation</span></div>'+ni+'</nav><div class="sidebar-footer"><div class="sidebar-user"><div class="user-avatar">'+initials(user.name)+'</div><div class="user-info"><div class="user-name">'+user.name+'</div><div class="user-role">'+(ROLE_LABELS[user.role]||user.role)+'</div></div></div><a href="index.html" class="btn-logout">'+NAV_ICONS.logout+'<span>Sign out</span></a></div></aside><div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>';
  var lk=NAV_LINKS.find(function(l){return l.href===page;});
  var mh='<header class="mobile-header"><div class="mobile-header-brand">'+NAV_ICONS.logo+'<span>'+(lk?lk.label:"DermisAI")+'</span></div><button class="mobile-menu-btn" id="mobileMenuBtn" aria-expanded="false">'+NAV_ICONS.menu+'</button></header>';
  var mount=document.getElementById("navMount");if(mount)mount.innerHTML=sb+mh;
  var mhEl=document.querySelector(".mobile-header"),al=document.querySelector(".app-layout");
  if(mhEl&&al&&al.contains(mhEl))al.parentNode.insertBefore(mhEl,al);
  var btn=document.getElementById("mobileMenuBtn"),sbn=document.getElementById("sidebar"),ov=document.getElementById("sidebarOverlay");
  if(btn&&sbn&&ov){btn.addEventListener("click",function(){sbn.classList.add("open");ov.classList.add("active");btn.setAttribute("aria-expanded","true");document.body.style.overflow="hidden";});ov.addEventListener("click",function(){sbn.classList.remove("open");ov.classList.remove("active");btn.setAttribute("aria-expanded","false");document.body.style.overflow="";});}
}

/* ── Demo data ── */
var ALL_LOGS=[
  {id:"LOG-8821",user:"Dr. Sarah Okonkwo", action:"CREATE_PREDICTION", table:"predictions",time:"2026-09-15T08:44:12Z",ip:"10.0.1.42",  status:"success"},
  {id:"LOG-8820",user:"Admin J. Hartwell", action:"CREATE_USER",       table:"users",      time:"2026-09-15T08:30:05Z",ip:"10.0.1.10",  status:"success"},
  {id:"LOG-8819",user:"Nurse Chen Lijuan", action:"VIEW_PATIENT",      table:"patients",   time:"2026-09-15T07:58:41Z",ip:"10.0.1.88",  status:"success"},
  {id:"LOG-8818",user:"Dr. Marcus Reeves", action:"VERIFY_PREDICTION", table:"predictions",time:"2026-09-14T16:12:30Z",ip:"10.0.1.55",  status:"success"},
  {id:"LOG-8817",user:"Dr. Priya Sharma",  action:"CREATE_PATIENT",    table:"patients",   time:"2026-09-14T15:40:22Z",ip:"192.168.2.7",status:"success"},
  {id:"LOG-8816",user:"system",            action:"SCHEDULED_BACKUP",  table:"system",     time:"2026-09-14T12:00:00Z",ip:"127.0.0.1",  status:"success"},
  {id:"LOG-8815",user:"Admin Rosa Navarro",action:"LOGIN",             table:"sessions",   time:"2026-09-14T09:05:11Z",ip:"10.0.2.15",  status:"failed"},
  {id:"LOG-8814",user:"Dr. Sarah Okonkwo", action:"CREATE_PREDICTION", table:"predictions",time:"2026-09-13T14:28:09Z",ip:"10.0.1.42",  status:"success"},
  {id:"LOG-8813",user:"Admin J. Hartwell", action:"UPDATE_HOSPITAL",   table:"hospitals",  time:"2026-09-13T11:15:55Z",ip:"10.0.1.10",  status:"success"},
  {id:"LOG-8812",user:"Nurse Amara Diallo",action:"VIEW_PATIENT",      table:"patients",   time:"2026-09-13T10:44:02Z",ip:"192.168.2.9",status:"success"},
  {id:"LOG-8811",user:"Dr. Ivan Sokolov",  action:"CREATE_PREDICTION", table:"predictions",time:"2026-09-13T09:20:18Z",ip:"10.0.3.22",  status:"success"},
  {id:"LOG-8810",user:"Dr. Marcus Reeves", action:"LOGIN",             table:"sessions",   time:"2026-09-13T08:58:47Z",ip:"10.0.1.55",  status:"success"},
  {id:"LOG-8809",user:"system",            action:"INTEGRITY_CHECK",   table:"system",     time:"2026-09-13T06:00:00Z",ip:"127.0.0.1",  status:"success"},
  {id:"LOG-8808",user:"Nurse Kim Jae-won", action:"VIEW_AUDIT_LOG",    table:"audit_logs", time:"2026-09-12T17:10:33Z",ip:"10.0.3.80",  status:"failed"},
  {id:"LOG-8807",user:"Dr. Sarah Okonkwo", action:"VERIFY_PREDICTION", table:"predictions",time:"2026-09-12T15:55:14Z",ip:"10.0.1.42",  status:"success"},
  {id:"LOG-8806",user:"Admin J. Hartwell", action:"DEACTIVATE_USER",   table:"users",      time:"2026-09-12T14:02:08Z",ip:"10.0.1.10",  status:"success"},
  {id:"LOG-8805",user:"Dr. Priya Sharma",  action:"CREATE_PREDICTION", table:"predictions",time:"2026-09-11T11:38:29Z",ip:"192.168.2.7",status:"success"},
  {id:"LOG-8804",user:"Dr. Ivan Sokolov",  action:"LOGIN",             table:"sessions",   time:"2026-09-11T09:10:55Z",ip:"10.0.3.22",  status:"success"},
];

var filters={search:"",action:"",status:"",page:1,perPage:12};

function actionChip(action){
  var prefix=action.split("_")[0];
  var cls=["CREATE","VIEW","UPDATE","VERIFY","LOGIN","DEACTIVATE"].indexOf(prefix)!==-1?"action-"+prefix:["SCHEDULED","INTEGRITY"].some(function(p){return action.startsWith(p);})?("action-"+action.split("_")[0]):"action-SCHEDULED";
  return'<span class="action-chip '+cls+'">'+action+'</span>';
}
function statusBadge(status){
  if(status==="failed")return'<span class="badge badge-concern"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Failed</span>';
  return'<span class="badge badge-healthy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>Success</span>';
}

function renderPagination(container,total,page,perPage,onPage){
  var totalPages=Math.ceil(total/perPage),start=(page-1)*perPage+1,end=Math.min(page*perPage,total),pages="";
  for(var i=1;i<=totalPages;i++){
    if(i===1||i===totalPages||(i>=page-1&&i<=page+1))pages+='<button class="page-btn'+(i===page?" active":"")+'" data-page="'+i+'">'+i+'</button>';
    else if(i===page-2||i===page+2)pages+='<span style="color:var(--color-text-muted);padding:0 4px">…</span>';
  }
  container.innerHTML='<div class="pagination"><div class="pagination-info">Showing '+start+'–'+end+' of '+total+' entries</div><div class="pagination-controls"><button class="page-btn" data-page="'+(page-1)+'" '+(page<=1?"disabled":"")+' aria-label="Prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></button>'+pages+'<button class="page-btn" data-page="'+(page+1)+'" '+(page>=totalPages?"disabled":"")+' aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></button></div></div>';
  container.querySelectorAll(".page-btn:not([disabled])").forEach(function(btn){btn.addEventListener("click",function(){var p=parseInt(btn.dataset.page,10);if(p&&p!==page)onPage(p);});});
}

function renderLogs(){
  var f=filters;
  var filtered=ALL_LOGS.filter(function(l){
    return(!f.search||(l.user+l.action+l.id).toLowerCase().includes(f.search.toLowerCase()))
      &&(!f.action||l.action===f.action)&&(!f.status||l.status===f.status);
  });
  document.getElementById("logCount").textContent=filtered.length+" entr"+(filtered.length!==1?"ies":"y");
  var tbody=document.getElementById("auditTbody");
  var items=filtered.slice((f.page-1)*f.perPage,f.page*f.perPage);
  if(!items.length){tbody.innerHTML='<tr><td colspan="7"><div class="state-container"><div class="state-icon empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div><p class="state-title">No log entries found.</p><p class="state-description">Try adjusting your search or filter criteria.</p></div></td></tr>';document.getElementById("auditPagMount").innerHTML="";return;}
  tbody.innerHTML=items.map(function(l){
    return'<tr><td><span class="log-id">'+l.id+'</span></td><td style="color:var(--color-text-secondary);font-size:var(--text-sm)">'+l.user+'</td><td>'+actionChip(l.action)+'</td><td><span class="table-tag">'+l.table+'</span></td><td style="white-space:nowrap;font-size:var(--text-sm);color:var(--color-text-muted)">'+formatDateTime(l.time)+'</td><td><span class="ip-address">'+l.ip+'</span></td><td>'+statusBadge(l.status)+'</td></tr>';
  }).join("");
  renderPagination(document.getElementById("auditPagMount"),filtered.length,f.page,f.perPage,function(p){filters.page=p;renderLogs();});
}

/* ── Boot ── */
initNav();
var auditSearch=document.getElementById("auditSearch");
var actionFilter=document.getElementById("actionFilter");
var statusFilter=document.getElementById("statusFilter");
var debSearch=debounce(function(){filters.search=auditSearch.value.trim();filters.page=1;renderLogs();});
auditSearch.addEventListener("input",debSearch);
actionFilter.addEventListener("change",function(){filters.action=actionFilter.value;filters.page=1;renderLogs();});
statusFilter.addEventListener("change",function(){filters.status=statusFilter.value;filters.page=1;renderLogs();});
setTimeout(renderLogs,400);
</script>
</body>
</html>
